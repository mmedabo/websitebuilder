# Temporary: fetch the client logos from ii-th.com, which the authoring
# environment cannot download. Remove this workflow once the logos are in.
name: Fetch client logos (temporary)

on:
  push:
    branches: [claude/relaxed-heisenberg-c1bjir]
    paths:
      - '.github/scripts/logo_ids.txt'
      - '.github/workflows/fetch-logos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the original files
        run: |
          mkdir -p reference/ii-th/images/clients
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsSL --retry 3 -o "reference/ii-th/images/clients/$id" "https://static.wixstatic.com/media/$id" || echo "failed: $id"
          done < .github/scripts/logo_ids.txt
          ls -la reference/ii-th/images/clients
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add client logos from ii-th.com (fetched)"
            git push origin HEAD:${{ github.ref_name }}
          fi

# TEMPORARY: fetch the original "Our Expertise" photos from ii-th.com (Wix media) at full
# size, because the build environment cannot reach Wix. Removed after one run.
name: Fetch product photos

on:
  push:
    branches: [claude/relaxed-heisenberg-c1bjir]
    paths: ['.github/workflows/fetch-product-photos.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          mkdir -p reference/ii-th/images/products
          cd reference/ii-th/images/products
          while read name id; do
            curl -fsSL --retry 3 -o "$name" "https://static.wixstatic.com/media/$id" && echo "ok $name" || echo "FAILED $name"
          done <<'EOF'
          appliances.jpg 97a516_12508a0528804a869be7a4169da40827.jpg
          lighting.jpg 97a516_7183ef68ddc24e509f0cb1a4139e9d07.jpg
          wire-cable.jpg 97a516_da810f835d7b449987faaa1acc9ac699.jpg
          plumbing.jpeg 97a516_1e2cae4d40ff4f60a0f3e71a89b1d4e6.jpeg
          plastics.jpg 97a516_37cbd22c5af246a7a840202096d4f474.jpg
          high-tech.jpg 97a516_b9f0b1ee3a0b4a328c61258af2c5b109.jpg
          textiles.png 56899eeca21ecb90759552633b99b987.png
          toys.jpg 49cb2870d8d7944aa1c5785b6eddcc4a.jpg
          life-safety.jpg 97a516_e86b290aef76424493e35802afaf3ab9.jpg
          energy.jpg 97a516_6af0f3a3a3424fcda87299ea1985e5c9.jpg
          building-materials.jpg 97a516_cf652fa35ba74c60ada586ecca33e949.jpg
          EOF
          ls -la
          file *
      - name: Commit
        run: |
          git add reference/ii-th/images/products
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Add original product photos from ii-th.com (full size)" || exit 0
          git push

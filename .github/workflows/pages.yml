name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as the Tests workflow: browsers and fonts for the tests below.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      # Read the site's path and URL from Pages, so a custom domain needs no code change.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Test the exact build that will go live. A failure stops here: the live site stays as it was.
      - name: Run the tests
        run: npx playwright test
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also runs a
      # branch build that publishes the README over the site. Switch the source
      # to GitHub Actions; if that is not allowed, wait for the branch build of
      # this commit to finish, so this deploy is always the last one.
      - name: Use GitHub Actions as the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
      - name: Wait for the branch build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            echo "branch builds still running: $busy"
            [ "$busy" = "0" ] && exit 0
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4

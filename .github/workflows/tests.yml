name: Tests

# Runs the end-to-end tests on every branch push, before anything reaches main.
# The deploy workflow runs the same tests again on main and deploys only if they pass.
#
# Screenshot baselines: a branch run creates any baseline that does not exist yet and
# commits it. After an intended design change, run this workflow by hand on the branch
# with "update screenshots" ticked to replace the changed ones.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'site/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Replace changed screenshot baselines and commit them
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official image has the three browsers and their fonts, so screenshots match run to run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run build
        env:
          BASE: /websitebuilder/
          SITE_URL: https://mmedabo.github.io/websitebuilder
      - name: Run the tests
        run: npx playwright test --update-snapshots=${{ inputs.update-screenshots && 'changed' || 'missing' }}
      - name: Commit new screenshot baselines
        if: success()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add tests/__screenshots__
          if git diff --cached --quiet; then echo "No new baselines."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update screenshot baselines"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 14

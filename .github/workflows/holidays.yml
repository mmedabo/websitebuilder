# Temporary: fetch the Bank of Thailand holiday lists, which the authoring
# environment cannot reach. Remove after use.
name: Fetch Thai holidays (temporary)

on:
  push:
    branches: [claude/relaxed-heisenberg-c1bjir]
    paths:
      - '.github/scripts/holidays.mjs'
      - '.github/workflows/holidays.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node .github/scripts/holidays.mjs
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/holidays
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add Bank of Thailand holiday lists (fetched)"
            git push origin HEAD:${{ github.ref_name }}
          fi
